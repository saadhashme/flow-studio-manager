name: Build macOS DMG & ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Mac Packages (.dmg & .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:mac -- --publish never

      - name: Upload Mac Installers
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Studio-Manager-macOS-DMG
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
